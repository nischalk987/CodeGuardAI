services:
  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      FRONTEND_ORIGIN: http://localhost:5173
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      DATABASE_URL: postgresql+psycopg://codeguard:codeguard@postgres:5432/codeguard
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    ports:
      - "8000:8000"
    depends_on:
    
  worker:
    build:
      context: ./backend
    command: ["celery", "-A", "app.jobs.queue:celery_app", "worker", "--loglevel=INFO", "--queues=reviews", "--pool=solo"]
    environment:
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      FRONTEND_ORIGIN: http://localhost:5173
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      DATABASE_URL: postgresql+psycopg://codeguard:codeguard@postgres:5432/codeguard
      REDIS_URL: redis://redis:6379/0
      AI_PROVIDER: groq
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_PRIVATE_KEY_PATH: ${GITHUB_PRIVATE_KEY_PATH:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
  web:
    build:
      context: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: codeguard
      POSTGRES_USER: codeguard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codeguard-local-only}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeguard -d codeguard"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
