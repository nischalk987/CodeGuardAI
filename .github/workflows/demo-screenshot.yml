name: Demo screenshot

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"
      - "docs/**"
      - "README.md"
      - "docker-compose.yml"
      - ".github/workflows/demo-screenshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture-demo:
    name: Capture labelled dashboard demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install
      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-1.55.0-${{ runner.os }}
      - name: Install headless Chromium
        run: npx --yes playwright@1.55.0 install chromium
      - name: Start the Vite demo
        working-directory: frontend
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/codeguard-vite.log 2>&1 &
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/codeguard-vite.log
          exit 1
      - name: Capture the actual dashboard demo
        working-directory: frontend
        run: |
          mkdir -p ../artifacts
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size "1440,1000" --full-page --wait-for-timeout 2500 http://127.0.0.1:5173/ ../artifacts/codeguard-dashboard-demo.png
      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: codeguard-dashboard-demo
          path: artifacts/codeguard-dashboard-demo.png
          if-no-files-found: error
          retention-days: 30
