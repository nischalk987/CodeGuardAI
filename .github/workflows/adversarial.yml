name: Adversarial security regression

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  adversarial:
    name: Prompt injection and secret leakage tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend and test dependencies
        working-directory: backend
        run: python -m pip install -e ".[dev]"
      - name: Run adversarial regression suite
        working-directory: backend
        env:
          GROQ_API_KEY: ""
          HF_TOKEN: ""
          GITHUB_APP_ID: ""
          GITHUB_WEBHOOK_SECRET: ""
        run: pytest tests/test_adversarial_security.py
