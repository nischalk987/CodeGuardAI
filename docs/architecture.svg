<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">CodeGuard AI architecture</title>
<desc id="desc">React frontend talks to FastAPI, which stores review state in PostgreSQL and queues work in Redis for a Celery worker. The worker uses deterministic built-in or optional Semgrep analysis and an optional Groq or Hugging Face AI reviewer. A GitHub webhook connects to the API; full PR diff review is incomplete.</desc>
<defs>
  <style>
    .bg{fill:#f8fafc}.box{fill:#fff;stroke:#334155;stroke-width:2;rx:14}.external{fill:#fff7ed;stroke:#c2410c;stroke-width:2;rx:14}.planned{fill:#f1f5f9;stroke:#64748b;stroke-width:2;stroke-dasharray:7 5;rx:14}.title{font:700 22px Arial,sans-serif;fill:#0f172a}.label{font:16px Arial,sans-serif;fill:#334155}.note{font:14px Arial,sans-serif;fill:#475569}.edge{stroke:#475569;stroke-width:2.4;fill:none}.edgeopt{stroke:#c2410c;stroke-width:2.2;fill:none;stroke-dasharray:7 5}
  </style>
  <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#475569"/></marker>
  <marker id="arrowopt" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#c2410c"/></marker>
</defs>
